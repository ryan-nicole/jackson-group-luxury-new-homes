name: Restore full clean master
on:
  push:
    branches: [master-clean-staging]
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore complete source and overlay approved clean pages
        shell: bash
        run: |
          set -euo pipefail
          BASE=2f7878152b55a66bf05901a8782a02b81981e0c4
          CLEAN=a0957733307a15508e3554d119771ffb7602cf42
          mkdir -p /tmp/jg-base
          git archive "$BASE" | tar -x -C /tmp/jg-base
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/jg-base/. .
          : > /tmp/jg-clean.b64
          for p in .source/site-text.tar.gz.b64 .source/site-text.tar.gz.b64.1 .source/site-text.tar.gz.b64.2 .source/site-text.tar.gz.b64.3; do
            git show "$CLEAN:$p" >> /tmp/jg-clean.b64
          done
          base64 -d /tmp/jg-clean.b64 > /tmp/jg-clean.tar.gz
          tar -xzf /tmp/jg-clean.tar.gz -C .
          rm -f DELETE-*.txt README.txt
          find . -maxdepth 1 -type f -name 'README-*.txt' ! -name 'README-MASTER.txt' -delete
          rm -f communities/index.html communities/community-guide.css
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f site-shell.css
          test -f rebate-calculator-shared.js
          test -f admin/admin.js
          test -f admin/admin.css
          test -f homes/index.html
          test -f builders/index.html
          test -f rebates/index.html
          test -f how-it-works/index.html
          test -f faq/index.html
          test -f register/index.html
          grep -q 'upperTierOffset:350' rebate-calculator-shared.js
          grep -q 'p<450000?p\*.0075:(p\*.01)-350' rebate-calculator-shared.js
          ! test -f communities/index.html
          ! find . -maxdepth 1 -type f -name 'DELETE-*.txt' | grep -q .
      - name: Commit complete clean source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Restore complete clean master source'
          git push origin HEAD:master-clean-staging
