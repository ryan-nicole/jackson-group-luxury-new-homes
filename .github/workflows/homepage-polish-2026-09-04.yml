name: Homepage polish
on:
  push:
    branches: [master-clean-staging]
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested homepage refinements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text()

          old='<option value="">Any</option><option value="300000-400000">$300K–$400K</option>'
          new='<option value="">Any</option><option value="100000-200000">$100K–$200K</option><option value="200000-300000">$200K–$300K</option><option value="300000-400000">$300K–$400K</option>'
          if old not in s:
              raise SystemExit('Price options anchor not found')
          s=s.replace(old,new,1)

          s,n=re.subn(r'\n<div class="builder-form-home-actions">.*?</div>\n', '\n', s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit('Builder form action block not found')

          s,n=re.subn(r'\n<section class="featured section" id="featured".*?</section>\n\n</main>', '\n</main>', s, count=1, flags=re.S)
          if n!=1:
              raise SystemExit('Featured section not found')

          p.write_text(s)

          css=Path('homepage-refinements.css')
          c=css.read_text()
          marker='/* ===== Requested homepage polish — Sep 4 2026 ===== */'
          if marker in c:
              c=c.split(marker)[0].rstrip()+"\n\n"
          c += r'''
/* ===== Requested homepage polish — Sep 4 2026 ===== */

/* Before You Tour: clear visual separation + site-consistent typography */
.before-tour{
  background:#e9dfd0 !important;
  border-top:1px solid #d5c5ad !important;
  border-bottom:1px solid #d5c5ad !important;
  padding:72px 0 !important;
}
.before-tour h2{
  font-family:Georgia,serif !important;
  font-weight:500 !important;
  letter-spacing:0 !important;
}
.before-tour .before-tour-copy,
.before-tour .statement,
.before-tour .statement strong,
.before-tour .benefit{
  font-family:Arial,Helvetica,sans-serif !important;
  letter-spacing:0 !important;
}
.before-tour .statement strong{
  font-size:1.05rem !important;
  line-height:1.55 !important;
  font-weight:700 !important;
  color:#2b261f !important;
}
.before-tour .benefit{
  background:rgba(255,255,255,.58) !important;
  border-color:#cdbb9f !important;
}

/* Builder form: match normal site typography and simplify the section */
.builder-form-home{
  background:#f8f4ed !important;
}
.builder-form-home-copy h2,
.builder-form-preview-card .form-preview-top strong{
  font-family:Georgia,serif !important;
  font-weight:500 !important;
}
.builder-form-home-copy p,
.builder-form-preview-card,
.form-preview-row,
.form-preview-top small{
  font-family:Arial,Helvetica,sans-serif !important;
  letter-spacing:0 !important;
}
.builder-form-preview-card{
  border-radius:20px !important;
  box-shadow:0 14px 34px rgba(31,25,17,.06) !important;
}

/* What Can We Help You With: finished card treatment */
.journey{
  background:#fff !important;
  border-top:1px solid #ece4d8;
  border-bottom:1px solid #ece4d8;
}
.journey .section-heading{
  max-width:760px;
  margin-left:auto;
  margin-right:auto;
}
.journey .section-heading h2{
  font-family:Georgia,serif !important;
  font-weight:500 !important;
  font-size:clamp(2.3rem,4vw,3.7rem) !important;
  line-height:1.06 !important;
}
.journey .section-heading p{
  max-width:680px;
  margin-left:auto;
  margin-right:auto;
  color:#6f675c;
  line-height:1.7;
}
.journey-grid{
  display:grid !important;
  grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  gap:18px !important;
  max-width:960px !important;
  margin:34px auto 0 !important;
}
.journey-choice{
  position:relative;
  min-height:150px;
  display:flex !important;
  align-items:center;
  padding:27px 28px !important;
  border:1px solid #ded3c4 !important;
  border-radius:20px !important;
  background:#faf7f1 !important;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease;
}
.journey-choice:hover{
  transform:translateY(-2px);
  border-color:#c7a66d !important;
  box-shadow:0 13px 30px rgba(38,30,18,.07);
}
.journey-choice input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}
.journey-choice span{
  display:grid;
  gap:9px;
}
.journey-choice b{
  font-family:Georgia,serif !important;
  font-size:1.24rem !important;
  font-weight:500 !important;
  color:#211d18;
}
.journey-choice small{
  font-size:.9rem !important;
  color:#756d62 !important;
  line-height:1.5;
}
.journey-choice:has(input:checked){
  background:#efe3cf !important;
  border-color:#bd9148 !important;
  box-shadow:inset 0 0 0 1px #bd9148,0 13px 30px rgba(38,30,18,.07);
}
.journey-choice:has(input:checked)::after{
  content:'✓';
  position:absolute;
  top:18px;
  right:20px;
  width:28px;
  height:28px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#1c1915;
  color:#fff;
  font-size:.78rem;
  font-weight:800;
}
.journey-actions{
  max-width:960px;
  margin:24px auto 0 !important;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}
.journey-actions .button{
  min-width:190px;
  border-radius:999px !important;
  padding:15px 28px !important;
}

/* Footer calls to action: both should feel important */
.footer-start-actions{
  gap:12px !important;
}
.footer-start-actions .button.gold,
.footer-start-actions .footer-register-link{
  min-height:48px;
  display:inline-flex !important;
  align-items:center;
  justify-content:center;
  padding:0 22px !important;
  border-radius:999px !important;
  font-family:Arial,Helvetica,sans-serif !important;
  font-size:.84rem !important;
  font-weight:800 !important;
  text-decoration:none !important;
}
.footer-start-actions .button.gold{
  background:#c99a42 !important;
  color:#100d08 !important;
  border:1px solid #d7ae66 !important;
  box-shadow:0 9px 22px rgba(0,0,0,.18);
}
.footer-start-actions .footer-register-link{
  background:#f4ede2 !important;
  color:#1b1711 !important;
  border:1px solid #e1c899 !important;
  box-shadow:0 9px 22px rgba(0,0,0,.14);
}
.footer-start-actions .button.gold:hover,
.footer-start-actions .footer-register-link:hover{
  transform:translateY(-1px);
  filter:brightness(1.04);
}

@media(max-width:760px){
  .journey-grid{grid-template-columns:1fr !important;}
  .before-tour{padding:56px 0 !important;}
}
'''
          css.write_text(c)
          PY
          rm -f .github/workflows/homepage-polish-2026-09-04.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Polish homepage layout and search options'
          git push origin HEAD:master-clean-staging
